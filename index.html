<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>M Lucky 65 - Free Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 430px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      color: #facc15;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .demo-badge {
      display: block;
      width: fit-content;
      margin: 0 auto 18px;
      background: #14532d;
      color: #86efac;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .points {
      background: #1f2937;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    .points-label {
      color: #9ca3af;
      font-size: 13px;
    }

    .points-value {
      color: #facc15;
      font-size: 34px;
      font-weight: bold;
      margin-top: 4px;
    }

    .number-box {
      text-align: center;
      background: #0f172a;
      border: 2px solid #374151;
      border-radius: 20px;
      padding: 25px 15px;
      margin-bottom: 18px;
    }

    .number {
      font-size: 76px;
      font-weight: 900;
      color: #facc15;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result {
      min-height: 25px;
      margin-top: 8px;
      font-weight: bold;
      color: #d1d5db;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    .play {
      background: #facc15;
      color: #111827;
    }

    .reset {
      background: #374151;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info {
      background: #1f2937;
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
      color: #d1d5db;
      font-size: 13px;
      line-height: 1.6;
    }

    .history {
      margin-top: 18px;
    }

    .history h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .history-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .history-item {
      background: #374151;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: bold;
      color: #facc15;
    }

    .empty-history {
      color: #6b7280;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 11px;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="game">

    <div class="logo">M LUCKY 65</div>

    <div class="subtitle">
      Fun Number Game
    </div>

    <span class="demo-badge">
      FREE-TO-PLAY DEMO
    </span>

    <section class="points">
      <div class="points-label">
        Virtual Points
      </div>

      <div class="points-value" id="points">
        1000
      </div>
    </section>

    <section class="number-box">

      <div class="number" id="number">

      </div>
